packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

allowBuilds:
  esbuild: true

# pnpm v11: settings sống ở đây (field "pnpm" trong package.json không còn đọc).
# Cho phép postinstall của native binary cần build (esbuild cho Vite; oxide cho Tailwind v4).
onlyBuiltDependencies:
  - esbuild
  - "@tailwindcss/oxide"
