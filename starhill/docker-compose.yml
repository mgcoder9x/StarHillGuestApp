# Stack MẶC ĐỊNH của StarHill = TỐI GIẢN cho vận hành thực (resort ~60 phòng): CHỈ PostgreSQL + Host.
# KHÔNG RabbitMQ (messaging TẮT) — event-driven là opt-in, chưa cần cho tới khi cascade GuestVisitEnded có consumer
# (Concierge/Housekeeping — QR-AD-027/QR-AD-034). Muốn bật messaging (RabbitMQ) để test đường event:
#   docker compose -f docker-compose.yml -f docker-compose.messaging.yml up -d --build
# Muốn phơi OpenAPI qua trình duyệt (dev): thêm  -f docker-compose.dev.yml  (QR-AD-033).
# LƯU Ý (F35): secret dưới đây là DEV placeholder. Production nạp secret qua orchestrator/secret store + áp migration
# OUT-OF-BAND (KHÔNG bật ApplyMigrationsOnStartup ở prod đa-instance — AD-050).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # MỘT database vật lý cho MỌI module (schema-per-module — design §1.2/§4.6). Migration per-module tạo schema
      # identity/resort_config/rooms/guest_access bên trong database này lúc Host start (ApplyMigrationsOnStartup).
      POSTGRES_DB: starhill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starhill"]
      interval: 3s
      timeout: 3s
      retries: 20

  host:
    build:
      # D1-a: context = REPO ROOT (cha của starhill/) để Docker thấy CẢ platform/ (base) lẫn starhill/ (sản phẩm).
      context: ..
      dockerfile: starhill/src/Host/StarHill.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Connection string trỏ service `postgres` trong mạng compose. MỌI module CÙNG database `starhill`
      # (schema-per-module), override từng key để không rơi về placeholder localhost trong appsettings.
      ConnectionStrings__Identity: "Host=postgres;Port=5432;Database=starhill;Username=postgres;Password=postgres"
      ConnectionStrings__ResortConfig: "Host=postgres;Port=5432;Database=starhill;Username=postgres;Password=postgres"
      ConnectionStrings__Rooms: "Host=postgres;Port=5432;Database=starhill;Username=postgres;Password=postgres"
      ConnectionStrings__GuestAccess: "Host=postgres;Port=5432;Database=starhill;Username=postgres;Password=postgres"
      # DEV placeholder secret (base64 ≥32B). Prod nạp qua secret store (F35).
      Jwt__Keys__0__Secret: "ZGV2LXBsYWNlaG9sZGVyLWp3dC1zaWduaW5nLWtleS0wMTIzNDU2Nzg5YWJjZGVm"
      # CHỈ dev/compose single-instance: Host tự áp migration lúc start. Prod đa-instance KHÔNG bật (AD-050).
      Bedrock__ApplyMigrationsOnStartup: "true"
      # Messaging TẮT (không RabbitMQ). Identity (mẫu base) vẫn ghi 1 outbox event khi refresh token → khai TƯỜNG MINH
      # chấp nhận outbox chưa có drainer (P1-15) để boot không bị chặn. Ở 60 phòng, số event này không đáng kể.
      Bedrock__Messaging__AllowOutboxWithoutDispatcher: "true"
    ports:
      - "18080:8080"
