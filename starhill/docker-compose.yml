# Chạy CẢ STACK local/staging: PostgreSQL + RabbitMQ + Host. Chứng minh "sản phẩm chạy được" end-to-end,
# GỒM đường event-driven (Outbox → worker → RabbitMQ) trên ARTIFACT THẬT (image build từ Dockerfile), không
# chỉ Testcontainers. LƯU Ý (F35): secret dưới đây là DEV placeholder (compose = dev/staging). Production nạp
# secret qua orchestrator/secret store + áp migration OUT-OF-BAND (KHÔNG bật ApplyMigrationsOnStartup ở prod
# đa-instance — AD-050) + KHÔNG dùng credential mặc định.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # MỘT database vật lý cho CẢ 3 module (schema-per-module — design §1.2/§4.6). Migration per-module tạo
      # schema identity/resort_config/rooms bên trong database này lúc Host start (ApplyMigrationsOnStartup).
      POSTGRES_DB: starhill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starhill"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13
    environment:
      # Dùng user RIÊNG (không 'guest'): 'guest' của RabbitMQ chỉ connect được qua LOOPBACK → từ container `host`
      # (non-loopback qua mạng compose) sẽ bị TỪ CHỐI. Đây là chi tiết deployment thật mà compose-với-image phơi
      # ra (Testcontainers map localhost nên không lộ). Dev placeholder — prod nạp qua secret store (F35).
      RABBITMQ_DEFAULT_USER: bedrock
      RABBITMQ_DEFAULT_PASS: bedrock
    healthcheck:
      # check_port_connectivity xác nhận LISTENER (gồm AMQP 5672) THẬT SỰ nhận kết nối — mạnh hơn 'ping' (chỉ báo
      # Erlang node up). Tránh race: consumer/worker Host kết nối lúc AMQP chưa mở → Connection refused → StopHost.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  host:
    build:
      # D1-a: context = REPO ROOT (cha của starhill/) để Docker thấy CẢ platform/ (base) lẫn starhill/ (sản phẩm).
      context: ..
      dockerfile: starhill/src/Host/StarHill.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Connection string trỏ service `postgres` trong mạng compose. CẢ 3 module CÙNG database `starhill`
      # (schema-per-module), override từng key để không rơi về placeholder localhost trong appsettings.
      ConnectionStrings__Identity: "Host=postgres;Port=5432;Database=starhill;Username=postgres;Password=postgres"
      ConnectionStrings__ResortConfig: "Host=postgres;Port=5432;Database=starhill;Username=postgres;Password=postgres"
      ConnectionStrings__Rooms: "Host=postgres;Port=5432;Database=starhill;Username=postgres;Password=postgres"
      ConnectionStrings__GuestAccess: "Host=postgres;Port=5432;Database=starhill;Username=postgres;Password=postgres"
      # DEV placeholder secret (base64 ≥32B). Prod nạp qua secret store (F35).
      Jwt__Keys__0__Secret: "ZGV2LXBsYWNlaG9sZGVyLWp3dC1zaWduaW5nLWtleS0wMTIzNDU2Nzg5YWJjZGVm"
      # CHỈ dev/compose single-instance: Host tự áp migration lúc start. Prod đa-instance KHÔNG bật (AD-050).
      Bedrock__ApplyMigrationsOnStartup: "true"
      # BẬT event-driven (opt-in, AD-056): cắm RabbitMQ + đăng ký dispatcher + LÊN LỊCH worker phát tự động.
      Bedrock__Messaging__Enabled: "true"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "bedrock"
      RabbitMq__Password: "bedrock"
    ports:
      - "18080:8080"
