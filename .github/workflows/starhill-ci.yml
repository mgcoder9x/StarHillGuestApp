name: StarHill CI

# CI của SẢN PHẨM StarHill QR (vendored Bedrock base tại starhill/). TÁCH khỏi CI base (ci.yml nhắm platform/).
# GitHub chỉ đọc workflow ở <repo-root>/.github/workflows/ → file này ở root nhưng MỌI bước nhắm starhill/.
# Chạy trên push nhánh tích hợp + PR. Runner ubuntu-latest có Docker → Testcontainers (PostgreSQL/RabbitMQ) chạy thật.
on:
  push:
    branches: [main, master, develop]
  pull_request:

# Hủy run cũ trên CÙNG ref (tiết kiệm runner + tránh tranh tài nguyên Docker/Testcontainers). Group theo
# workflow+ref → KHÔNG đụng group của CI base (github.workflow khác tên nên hai CI không hủy lẫn nhau).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege (tinh thần F35/AD-038): chỉ đọc repo.
permissions:
  contents: read

jobs:
  build-test:
    name: build + test (0 warning + Testcontainers + journal QR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pin theo starhill/global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: starhill/global.json

      # dotnet-ef (local tool) — pin trong starhill/.config/dotnet-tools.json; cần cho migration/tooling.
      - name: Restore local tools
        run: dotnet tool restore
        working-directory: starhill

      # TreatWarningsAsErrors=true → build Release là cổng "0 warning".
      - name: Build (Release)
        run: dotnet build Platform.slnx -c Release
        working-directory: starhill

      # Toàn bộ suite NGHIỆP VỤ QR: unit + architecture + contract + integration + Testcontainers (Docker runner).
      # D1-a: test BASE (gồm JournalConsistency base) chạy ở CI base (ci.yml, platform/). Suite này gồm
      # StarHillJournalConsistencyTests (journal QR, INV-1..5) → journal QR lệch = fail CI (anti-drift QR-AD-006).
      - name: Test (full suite)
        run: dotnet test Platform.slnx -c Release --no-build
        working-directory: starhill

  docker-image:
    name: docker build Host (StarHill.Api)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kiểm chứng Dockerfile Host build được (multi-stage .NET 10). D1-a: context = REPO ROOT để chứa CẢ
      # platform/ (base ProjectReference cross-tree) lẫn starhill/ (sản phẩm). Không push registry ở job này.
      - name: Build Host image
        run: docker build -f starhill/src/Host/StarHill.Api/Dockerfile -t starhill-api:ci .

  migration-bundle:
    # Sinh EF migration bundle SELF-CONTAINED (linux-x64) cho module Identity → artifact deploy áp migration
    # OUT-OF-BAND (AD-050/AD-055): bước deploy chạy bundle TRƯỚC rollout Host, KHÔNG auto-migrate trong app
    # (an toàn đa-instance). Khi thêm module QR có migration (ResortConfig/Rooms/...) → thêm bundle tương ứng.
    name: EF migration bundle (deploy artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pin theo starhill/global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: starhill/global.json

      - name: Restore local tools
        run: dotnet tool restore
        working-directory: starhill

      - name: Build Identity migration bundle (linux-x64, self-contained)
        run: >
          dotnet ef migrations bundle
          --project src/Modules/Identity/Identity.Infrastructure
          --startup-project src/Modules/Identity/Identity.Infrastructure
          --self-contained -r linux-x64 -o efbundle-identity --force
        working-directory: starhill

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: starhill-efbundle-identity
          path: starhill/efbundle-identity

      - name: Build ResortConfig migration bundle (linux-x64, self-contained)
        run: >
          dotnet ef migrations bundle
          --project src/Modules/ResortConfig/ResortConfig.Infrastructure
          --startup-project src/Modules/ResortConfig/ResortConfig.Infrastructure
          --self-contained -r linux-x64 -o efbundle-resortconfig --force
        working-directory: starhill

      - name: Upload ResortConfig bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: starhill-efbundle-resortconfig
          path: starhill/efbundle-resortconfig

      - name: Build Rooms migration bundle (linux-x64, self-contained)
        run: >
          dotnet ef migrations bundle
          --project src/Modules/Rooms/Rooms.Infrastructure
          --startup-project src/Modules/Rooms/Rooms.Infrastructure
          --self-contained -r linux-x64 -o efbundle-rooms --force
        working-directory: starhill

      - name: Upload Rooms bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: starhill-efbundle-rooms
          path: starhill/efbundle-rooms

      - name: Build GuestAccess migration bundle (linux-x64, self-contained)
        run: >
          dotnet ef migrations bundle
          --project src/Modules/GuestAccess/GuestAccess.Infrastructure
          --startup-project src/Modules/GuestAccess/GuestAccess.Infrastructure
          --self-contained -r linux-x64 -o efbundle-guestaccess --force
        working-directory: starhill

      - name: Upload GuestAccess bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: starhill-efbundle-guestaccess
          path: starhill/efbundle-guestaccess

      - name: Build Rules migration bundle (linux-x64, self-contained)
        run: >
          dotnet ef migrations bundle
          --project src/Modules/Rules/Rules.Infrastructure
          --startup-project src/Modules/Rules/Rules.Infrastructure
          --self-contained -r linux-x64 -o efbundle-rules --force
        working-directory: starhill

      - name: Upload Rules bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: starhill-efbundle-rules
          path: starhill/efbundle-rules
