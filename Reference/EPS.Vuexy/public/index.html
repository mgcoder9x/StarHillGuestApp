<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1.0,maximum-scale=1"
        />

        <!-- Splash Screen/Loader Styles -->
        <link
            rel="stylesheet"
            type="text/css"
            href="<%= BASE_URL %>loader.css"
        />

        <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
        <!-- <link rel="stylesheet" href="https://kendo.cdn.telerik.com/themes/5.9.0/default/default-main.css" /> -->
        <title>Smart Vision</title>
    </head>
    <body>
        <noscript>
            <strong
                >We're sorry but Vuexy - Vuejs Admin Dashboard Template doesn't
                work properly without JavaScript enabled. Please enable it to
                continue.</strong
            >
        </noscript>
        <div id="loading-bg">
            <div class="loading-logo">
                <img src="<%= BASE_URL %>logo.png" alt="Logo" />
            </div>
            <div class="loading">
                <div class="effect-1 effects"></div>
                <div class="effect-2 effects"></div>
                <div class="effect-3 effects"></div>
            </div>
        </div>
        <div id="app"></div>
        <script src="/NodePlayer.min.js"></script>
        <script src="/jquery-3.2.1.min.js"></script>
        <!-- <script src="/telerikReportViewer.js"></script> -->
        <script src="/telerikReportViewer.kendo.min.js"></script>
        <!-- built files will be auto injected -->
    </body>
</html>
